<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bouton PLAY SVG</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
        }
        .button-group {
            cursor: pointer;
        }
        .top-layer-group {
            transition: transform 0.2s;
        }
        .button-group:hover .top-layer-group {
            transform: translateY(5px);
        }
        .button-group:active .top-layer-group {
            transform: translateY(8px);
        }
        .button-group .top-layer {
            transition: fill 0.2s;
        }
        .button-group:active .top-layer {
            fill: #2980b9;
        }
    </style>
</head>
<body>
    <svg width="840" height="335" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
                <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
        </defs>

        <g class="button-group">
            <rect x="0" y="5" width="120" height="40" rx="10" ry="10" fill="#1f5b83"/>
            <g class="top-layer-group">
                <rect class="top-layer" x="0" y="0" width="120" height="40" rx="10" ry="10" fill="#3498db"/>
                <rect class="light-reflection" x="0" y="0" width="120" height="20" rx="10" ry="10" fill="url(#shine)"/>
                <text x="60.0" y="24.0" font-family="Arial" font-size="20" fill="white" font-weight="bold" text-anchor="middle" alignment-baseline="middle">PLAY</text>
            </g>
        </g>
    </svg>
</body>
</html>
